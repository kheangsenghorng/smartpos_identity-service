services:

  identity-service:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: smartpos-identity-service

    restart: unless-stopped

    env_file:
      - .env

    expose:
      - "8000"

    volumes:
      - /opt/smartpos/secrets/identity-jwt:/run/secrets/identity-jwt:ro

    depends_on:
      identity-mysql:
        condition: service_healthy

      identity-redis:
        condition: service_healthy

    networks:
      identity-network:

      identity-smartpos-network:
        aliases:
          - identity-service

  identity-mysql:
    image: mysql:8.4

    container_name: smartpos-identity-mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - identity-mysql-data:/var/lib/mysql

    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      identity-network:
        aliases:
          - mysql

  identity-redis:
    image: redis:8-alpine

    container_name: smartpos-identity-redis

    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}

    volumes:
      - identity-redis-data:/data

    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

    networks:
      identity-network:
        aliases:
          - redis

  identity-phpmyadmin:
    image: phpmyadmin:5

    container_name: smartpos-identity-phpmyadmin

    restart: unless-stopped

    profiles:
      - tools

    ports:
      - "127.0.0.1:8081:80"

    environment:
      PMA_HOST: identity-mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M

    depends_on:
      identity-mysql:
        condition: service_healthy

    networks:
      - identity-network
      - identity-admin-network

networks:

  identity-network:
    driver: bridge
    internal: true

  identity-admin-network:
    driver: bridge

  identity-smartpos-network:
    name: smartpos-network
    external: true

volumes:

  identity-mysql-data:

  identity-redis-data:
