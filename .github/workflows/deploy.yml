name: Deploy Identity Service

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: VPS_HOST

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Identity Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}

          script_stop: true
          command_timeout: 30m

          script: |
            set -e

            echo "============================================"
            echo "🚀 SmartPOS Identity Deployment"
            echo "============================================"

            cd /opt/smartpos/identity-service

            echo "💾 Backup database"
            if [ -x /opt/smartpos/backups/scripts/backup-identity-db.sh ]; then
              /opt/smartpos/backups/scripts/backup-identity-db.sh || true
            fi

            echo "⬇️ Pull latest code"
            git fetch origin master
            git reset --hard origin/master

            echo "🔑 Ensuring JWT keys exist"
            mkdir -p storage/certs 2>/dev/null || true
            if [ ! -f storage/certs/jwt-rsa-2048-private.pem ] && [ ! -f storage/certs/private.pem ]; then
              echo "Generating 2048-bit RSA key pair for JWT..."
              openssl genrsa -out storage/certs/jwt-rsa-2048-private.pem 2048 2>/dev/null || true
              openssl rsa -in storage/certs/jwt-rsa-2048-private.pem -pubout -out storage/certs/jwt-rsa-2048-public.pem 2>/dev/null || true
            fi

            # Keep standard and prefixed key filenames synchronized
            [ -f storage/certs/jwt-rsa-2048-private.pem ] && [ ! -f storage/certs/private.pem ] && cp -f storage/certs/jwt-rsa-2048-private.pem storage/certs/private.pem || true
            [ -f storage/certs/jwt-rsa-2048-public.pem ] && [ ! -f storage/certs/public.pem ] && cp -f storage/certs/jwt-rsa-2048-public.pem storage/certs/public.pem || true
            [ -f storage/certs/private.pem ] && [ ! -f storage/certs/jwt-rsa-2048-private.pem ] && cp -f storage/certs/private.pem storage/certs/jwt-rsa-2048-private.pem || true
            [ -f storage/certs/public.pem ] && [ ! -f storage/certs/jwt-rsa-2048-public.pem ] && cp -f storage/certs/public.pem storage/certs/jwt-rsa-2048-public.pem || true
            chmod 600 storage/certs/*.pem 2>/dev/null || true

            # Sync public key to shared secrets directory for downstream services
            mkdir -p /opt/smartpos/secrets/identity-jwt 2>/dev/null || true
            [ -f storage/certs/public.pem ] && cp -f storage/certs/public.pem /opt/smartpos/secrets/identity-jwt/public.pem 2>/dev/null || true
            [ -f storage/certs/jwt-rsa-2048-public.pem ] && cp -f storage/certs/jwt-rsa-2048-public.pem /opt/smartpos/secrets/identity-jwt/jwt-rsa-2048-public.pem 2>/dev/null || true

            COMPOSE_FILE="docker-compose.yml"
            [ -f "docker-compose.prod.yml" ] && COMPOSE_FILE="docker-compose.prod.yml"

            echo "🐳 Build containers"
            docker compose -f "${COMPOSE_FILE}" build identity-service

            echo "🚀 Start services"
            docker compose -f "${COMPOSE_FILE}" up -d \
              identity-mysql \
              identity-redis \
              identity-service \
              identity-horizon

            echo "⏳ Wait for application"
            sleep 8

            echo "🗄 Run migrations"
            docker compose -f "${COMPOSE_FILE}" exec -T identity-service \
              php artisan migrate --force

            echo "🧹 Clear cache"
            docker compose -f "${COMPOSE_FILE}" exec -T identity-service \
              php artisan optimize:clear

            echo "📋 Status"
            docker compose -f "${COMPOSE_FILE}" ps

            echo "✅ Deployment complete"

      - name: Health Check
        run: |
          curl \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            https://smartpos-api.servicefixit.me/api/v1/identity/health
