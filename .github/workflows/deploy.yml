name: Deploy Identity Service

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    # IMPORTANT: matches your GitHub Environment name
    environment: VPS_HOST

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Identity Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}

          script_stop: true
          command_timeout: 10m

          script: |
            set -e

            echo "============================================"
            echo "🚀 SmartPOS Identity Deployment"
            echo "============================================"

            cd /opt/smartpos/identity-service

            echo "💾 Backup database"
            if [ -x /opt/smartpos/backups/scripts/backup-identity-db.sh ]; then
              /opt/smartpos/backups/scripts/backup-identity-db.sh
            fi

            echo "⬇️ Pull latest code"
            git fetch origin master
            git reset --hard origin/master

            echo "🐳 Build containers"
            docker compose build identity-service

            echo "🚀 Start services"
            docker compose up -d \
              identity-mysql \
              identity-redis \
              identity-service

            echo "⏳ Wait for application"
            sleep 8

            echo "🗄 Run migrations"
            docker compose exec -T identity-service \
              php artisan migrate --force

            echo "🧹 Clear cache"
            docker compose exec -T identity-service \
              php artisan optimize:clear

            echo "📋 Status"
            docker compose ps

            echo "✅ Deployment complete"

      - name: Health Check
        run: |
          curl \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            https://smartpos-api.servicefixit.me/api/v1/identity/health
