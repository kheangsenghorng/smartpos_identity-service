name: CD - Deploy to VPS

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          script: |
            echo "=============================================="
            echo "🚀 Starting Automated Deployment: Identity Service"
            echo "=============================================="
            
            # Navigate to workspace
            if [ -d "/var/www/smartpos" ]; then
              cd /var/www/smartpos
              
              # If central deploy.sh exists, use it
              if [ -f "deploy.sh" ]; then
                chmod +x deploy.sh
                ./deploy.sh identity
              else
                cd identity-service
                git pull origin master || git pull origin main
                docker compose up -d --build
                docker compose exec -T identity-service php artisan migrate --force
                docker compose exec -T identity-service php artisan optimize
              fi
            else
              echo "❌ Error: /var/www/smartpos directory not found on VPS."
              exit 1
            fi
            
            echo "=============================================="
            echo "✅ Identity Service Deployment Completed!"
            echo "=============================================="
